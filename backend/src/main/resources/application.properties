spring.application.name=campusdesk

# Only reachable from this computer, never from the network.
server.address=127.0.0.1

# ---- Sessions (login) ----
# Stay signed in for a working day of inactivity.
server.servlet.session.timeout=12h
# The session cookie can't be read by JavaScript (HttpOnly) and is never sent with requests
# that start on another website (SameSite=Strict). That blocks cross-site request forgery:
# a random web page can't make your browser act on CampusDesk on your behalf.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=CAMPUSDESK_SESSION

# ---- CampusDesk settings (see CampusDeskProperties.java) ----
# Port: 47130, or a free one if taken (override with CAMPUSDESK_PORT). Published in
# %LOCALAPPDATA%\CampusDesk\server.json.
# Data folder. In desktop mode this becomes %LOCALAPPDATA%\CampusDesk\data.
campusdesk.data-dir=./data
# Let students create their own accounts from the sign-in screen.
campusdesk.allow-student-signup=true

# ---- Database schema ----
spring.sql.init.mode=always

spring.jackson.default-property-inclusion=non_null
