<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusDesk</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Everything is rendered by app.js: the sign-in screens or the app shell. -->
  <div id="root"></div>
  <div id="dialog" class="backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <div class="dialog-head"><h2 id="dlgTitle"></h2></div>
      <div class="dialog-body" id="dlgBody"></div>
      <div class="dialog-foot">
        <button class="btn" id="dlgCancel">Cancel</button>
        <button class="btn primary" id="dlgOk">Save</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
